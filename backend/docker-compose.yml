version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: straysafe-postgres
    environment:
      POSTGRES_DB: straysafe_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - straysafe-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: straysafe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - straysafe-network
    restart: unless-stopped

  api:
    build: .
    container_name: straysafe-api
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/straysafe_db
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=straysafe_db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=straysafe-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=7d
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - straysafe-network
    restart: unless-stopped
    command: npm run dev

  adminer:
    image: adminer:4.8.1
    container_name: straysafe-adminer
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    networks:
      - straysafe-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  straysafe-network:
    driver: bridge